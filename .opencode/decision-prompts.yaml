# JEV decision prompts — the exact question texts ("assertions" / "criteria")
# handed to the typed-decision provider (openjev bridge or deterministic
# rules). One section per gate; each key's comment says what the question
# decides, who asks it, and what consumes the answer.
#
# Editing this file changes WHAT the model is asked — never the gate logic
# (thresholds, fail-open/fail-closed polarity, verdict handling, ledgers),
# which lives in the hooks and their lib modules.
#
# Format: flat two-level YAML (one top-level section per gate, indented
# `key: value` scalars). Keep values on a single line, quoted, without any
# ` #` sequence inside, and do NOT put blank lines inside a section — the
# dependency-free loader (lib/decision-prompts.ts) reads one key per line.
# Every key falls back to the built-in default in lib/decision-prompts.ts
# when this file or the key is missing/malformed; a change here is live on
# the next plugin boot.
#
# Not covered here: TRIAGE_ASSERTION (dead export, mirrored in
# openjevserver.py's selftest) and the profile/idea prompts (externalized
# per-hook in profile-prompts.json / idea prompts — milestones M3/M7).

retrieval:
  # Gate 1 — retrieval-hook, once per user turn (kind: noul, FAIL-CLOSED).
  # "Does this message need a vault search?" TRUE = self-contained → skip the
  # Brain-First rag-search this turn and inject [brain-first: SKIP]; a
  # confident FALSE injects [brain-first: RETRIEVE]. Error/abstain also maps
  # to SKIP (economy-first), but the deterministic hasRetrievalIntent pattern
  # runs FIRST, so "search my notes" always retrieves no matter what this
  # text says. Weighted toward TRUE on purpose: retrieval is opt-in.
  # Consumed by: retrieval-hook decideTurn() → evaluateRetrieval().
  assertion: "The user's message is self-contained and does NOT require a search of the vault: it needs no stored note, procedure, configuration, preference, past decision, remembered fact, or prior session context. The default is TRUE. Answer FALSE only when the message clearly refers to something previously documented or remembered, builds on earlier vault knowledge, or explicitly asks to search, recall, or remember. When in any doubt, answer TRUE."

autonomy:
  # Gate 4 — autonomy-gate, per borderline/jev-flagged call in gate mode
  # (kind: choice, FAIL-CLOSED). "May this exact call run without the user's
  # confirmation?" Candidates: allow | ask. A confident `allow` passes the
  # call; ask, abstain, error, timeout, or decisions-disabled all fall through
  # to the pending-ask flow (the user's strict confirm approves it, possibly
  # minting a batch grant). Asked only for the rows the level matrix flags
  # `jev` (borderline at L1–L4, destructive non-floor at L3, self-improve at
  # L4, deep-browser at L2) — floor denials and plain asks never reach the
  # model.
  # Consumed by: autonomy-gate tool.execute.before → jevAllows().
  assertion: "The proposed tool call is safe to run without the user's confirmation: it is part of the stated task, non-destructive, changes no security, permission, audit, or approval mechanism, and leaves nothing irreversible behind. Choose allow only when the action is routine and expected for this task; choose ask when it is ambiguous, security-relevant, irreversible, destructive, or outside the current task."

task:
  # Gate 5 — autonomy-gate, ONCE per user turn when enforcement: per-task
  # (kind: choice, FAIL-CLOSED to `unclear`). "What kind of task is this?"
  # Candidates: read-only | code-write | vault-write | web | destructive |
  # root | self-improve | unclear. The answer is mapped to the level matrix;
  # the agent is told to ask the user to proceed when it is above the level.
  # Consumed by: autonomy-gate task classification → taskDirective().
  assertion: "Classify the user's objective into exactly one task kind by the highest-risk action it will require: read-only (explain, inspect, search — no mutation), code-write (edit or add source/config files), vault-write (create or update notes), web (fetch or search the web), destructive (delete, remove packages, stop services, force-push), root (needs sudo/pkexec), self-improve (edits to .opencode/ hooks, agents, or the autonomy config), or unclear. Choose the highest kind the task will plausibly need; choose unclear when you cannot tell."

digest:
  # Gate 6 — heartbeat JEV digest, once per due tick after the deterministic
  # pre-gate (kind: choice, FAIL-OPEN to no_reply). "Which mission should the
  # heartbeat run, or stay silent?" Candidates: no_reply | mission:<id> for
  # every mission that already passed the structural filter (enabled, menu
  # window, min_level, candidacy). Each candidate carries a `warrant` (the
  # pending-work signal or due gate that admitted it), because the weight is
  # cadence × mood, not urgency. Error/abstain/unknown-id all resolve to
  # no_reply — a broken digest never invents work. The answer becomes the
  # typed verdict; brief = fixed prompt + verdict + mission body.
  # Consumed by: heartbeat.ts buildDigestChoiceRequest() + digestVerdictFromResult()
  # (scheduler: heartbeat-hook.ts, card D).
  assertion: "Decide whether this heartbeat tick should run one of the listed maintenance missions or stay silent. Each candidate carries a `warrant` naming why it is eligible: a pending-work warrant (`unconsumed_turns=N` / `backlog_pending=N`), a due gate (`min-gap ... due`, `dream gate passed`, `idea quota open`), or `judgment` when only the reported signals can decide. Answer mission:<id> when a candidate's warrant shows pending work or a gate that has come due — pending work is warranted even during quiet hours; for `judgment` candidates decide from the signals. Use the frequency × mood weight only to break ties among warranted candidates. If a candidate has no `warrant` field, judge it from the reported signals. Answer no_reply only when no candidate is warranted; never invent work."

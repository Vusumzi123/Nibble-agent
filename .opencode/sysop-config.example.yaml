# EXAMPLE configuration — tracked safe-to-share template. Copy to
# `sysop-config.yaml` (setup.sh does this) and adjust. Key semantics, optional
# keys, reader map: docs/sysop-config-reference.md. Keep blocks <= 3 lines.

paths:
  # Canonical path roots — the ONLY place vault/log/state/diagrams names live.
  # Every other path is a LEAF relative to these roots (absolute/~ honored).
  vault: Brain
  diagrams: diagrams
  log: .opencode/logs
  state: .opencode/state

vault:
  # Agent-forbidden, user-write-only folders (comma-separated, vault-relative).
  # The agent reads but never writes; enforced by vault-readonly-guard.ts.
  readonly: Journal

audit:
  # L5 audit trail: every bash command appended on tool.execute.after, redacted,
  # deterministic, no LLM (audit-hook.ts + lib/audit.ts). BARE rotation keys.
  enabled: true
  log: audit.log              # under <log> -> .opencode/logs/audit.log
  rotate_bytes: 10485760     # 10 MB
  keep_generations: 5        # audit.log.1 .. audit.log.5 (shift-and-rename)
  retention_days: 90         # delete rotated files older than this
  compress: true             # gzip rotated generations
  compress_after: 1          # keep audit.log.1 plain, gzip older
  compress_level: 6
  rotate_by: size            # size | daily | weekly

backlog:
  # Action queue: canonical store <state>/backlog.ndjson; the human view
  # <vault>/Backlog.md is regenerated one-way from it — never hand-edit.
  enabled: true
  file: backlog.ndjson        # LEAF under <state> -> .opencode/state/
  view_file: Backlog.md       # LEAF under <vault> -> Brain/Backlog.md
  dedupe: true                # skip appending a duplicate OPEN entry (source + title)
  max_view: 200               # max entries rendered per status section in the view

decisions:
  # Typed-decision JEV provider (openjevserver.py + decisions_bridge.py),
  # read live via lib/decisions.ts + lib/decision-gate.ts. Providers, local
  # backends and optional keys: docs/sysop-config-reference.md#decisions
  enabled: true               # master on/off — gates only when true
  mode: gate                   # shadow | gate
  provider: rules              # rules | openjev
  temperature_scaling: 1.00    # identity for clef; must stay 1.0 for self-reported tiers
  abstain_threshold: 0.45
  noul_threshold: 0.80         # gates skip only when model p >= this
  timeout_ms: 30000            # per-call subprocess timeout
  n_probs: 20                  # candidate token depth (unused by the structured tier)
  structured_max_tokens: 512   # JSON-mode budget — must cover reasoning + answer
  fallback: rules              # on error/abstain/timeout -> deterministic rules
  # Shadow ledger, one NDJSON line per decision; leaf under <log>.
  ledger: decisions.log
  log_rotate_bytes: 1048576
  log_keep_generations: 5
  log_retention_days: 90
  log_compress: true
  log_compress_after: 1
  log_compress_level: 6
  log_rotate_by: size

retrieval:
  # Per-turn self-RAG gate (retrieval-hook.ts). FAIL-CLOSED: an error, timeout
  # or abstain means no retrieval. gate: false = shadow (logged, always retrieves).
  enabled: true
  gate: true
  noul_threshold: 0.80         # skip only when model p("no retrieval needed") >= this
  timeout_ms: 30000            # per-turn decision subprocess timeout
  max_bytes: 4000              # only the head of the user message is judged
  summary_words: 400           # target length of the rag-search synthesis (answer-first)
  force_intent: true           # deterministic explicit-intent override -> retrieve
  inject: true                 # push the [brain-first] directive into the system prompt
  prompts_file: .opencode/decision-prompts.yaml  # JEV question texts; ~/absolute honored
  # Per-turn NDJSON ledger, one line per decision; leaf under <log>.
  log: retrieval.log
  log_rotate_bytes: 1048576
  log_keep_generations: 5
  log_retention_days: 90
  log_compress: true
  log_compress_after: 1
  log_compress_level: 6
  log_rotate_by: size

browser:
  # Deterministic web injection scan for webfetch/websearch (web-scan-hook).
  # Read once at startup — restart to apply. Scanner: lib/injection.ts.
  enabled: true              # master on/off — false disables the web scan
  injection_policy: flag     # flag = annotate+fence; block = also withhold instruction-family hits
  max_scan_bytes: 200000     # cap on bytes scanned per tool result (head only)
  # Full scan findings go here, not into the agent's context; leaf under <log>.
  scan_log: web-scan.log
  log_rotate_bytes: 1048576  # 1 MB
  log_keep_generations: 5
  log_retention_days: 90
  log_compress: true
  log_compress_after: 1
  log_compress_level: 6
  log_rotate_by: size

profile:
  # Persona + user context (profile-hook.ts): first-turn prompt injection, plus
  # an idle JEV decision that may update the two notes via a profile-writer
  # child (fail-open) behind a reviewer gate. Log vocabulary: reference doc.
  enabled: true
  agent_file: Agent.md         # under <vault> (absolute paths honored)
  user_file: User.md           # under <vault>
  inject: true                 # first-turn system-prompt injection
  inject_max_bytes: 4000       # per-note cap (frontmatter/Related already stripped)
  refresh_every_turns: 5       # re-inject the block every N turns (persona fade); 0 disables
  decide: true                 # idle JEV decision + conditional update
  cooldown_turns: 3            # min top-level idle turns between profile decisions
  decision_turns: 3            # last N session turns handed to the decision + writer
  decision_max_bytes: 24000    # cap on that transcript
  skip_triage: true            # skip the decision on trivial-chatter turns
  skip_triage_max_bytes: 800   # byte ceiling for the deterministic transcript classifier
  writer_agent: profile-writer # generation child (see .opencode/agents/profile-writer.md)
  child_timeout_ms: 90000      # max wait for the writer child to reply
  note_max_bytes: 6000         # writer hard budget; draft rejected above this
  prompts_file: .opencode/profile-prompts.json  # choice criteria + reviewer assertion
  review: true                 # post-draft durability/globalness gate before write
  review_threshold: 0.60       # noul pTrue needed to accept a drafted update
  log: profile-hook.log        # under <log>
  log_rotate_bytes: 1048576
  log_keep_generations: 5
  log_retention_days: 90
  log_compress: true
  log_compress_after: 1
  log_compress_level: 6
  log_rotate_by: size

telemetry:
  # NDJSON usage ledgers for expensive delegations (telemetry-hook.ts).
  # Logging only — zero behavior change, no LLM, no prompt text or full URLs.
  enabled: true                # master on/off — false disables both ledgers
  watch_agents: rag-search,safe-browser,deep-browser  # measured `task` delegates
  brain_log: rag-search.log
  web_log: web-usage.log
  rotate_bytes: 1048576
  keep_generations: 5
  retention_days: 90
  compress: true
  compress_after: 1
  compress_level: 6
  rotate_by: size

# Autonomy harness config plumbing (docs/autonomy-harness-plan.md §11). Values
# are hot-read per call — no restart; invalid values fall back to code defaults
# and warn once in <log>/autonomy-config.log. Details: docs reference.
autonomy:
  level: 3                     # 0..4 capability dial (§4.1); code default 1
  gate_mode: gate              # shadow | gate — kill switch: logs only vs enforces
  gate_scope: main             # main | all — main: sub-agents face only the floor
  heartbeat:
    frequency: 12h             # off | <n>m | <n>h — manual only (§4.2)
    in_progress_lock: true
  mission_token_budget: 32000  # K-tokens per mission turn, or `unlimited` (§6.4)
  root_classes: []             # L4 root allowlist; irreversibility floor applies first
  # `kind:name:class` triples mapping external tools/sub-agents into the level
  # matrix; `tool:` names may end in `*`. Class list: reference doc.
  class_overrides: []          # e.g. [tool:my-mcp_*:vault-write, subagent:my-agent:subagent-write]
  batch:                       # per-turn manifest approval
    max_actions: 8             # grant budget per confirmed autonomy-batch; 0 = one-shot only
  session_grant: off           # off | target | class — floor/root/self-improve never covered
  session_grant_ttl: 0         # minutes until a session grant expires; 0 = session lifetime
  enforcement: per-task        # per-command | per-task — one JEV classification per turn
  chatter:                     # idle chatter mission (§16) — off until card 7b
    enabled: false
    max_pokes: 3
    daily_budget: 2            # conversation openers per day
    cooldown: 12h              # between conversations
    reply_window: 24h          # await window before JEV poke/close triage
  quiet:                       # quiet-hours dream system (§17.9) — nested, NOT top-level
    window: "23:00-08:00"      # isQuietNow() predicate source
    dream_cadence: 30m
    resume_cooldown: 60m       # woken -> dreaming after this much silence
    dream_chance: 0.5          # pre-JEV roll for the dream candidate
    dream_token_budget: 8000   # hard per-tick cap (K tokens)
    nightly_dream_cap: 3
    backoff: true              # 30->60->120m on consecutive no-ops
    # night menu: per-mission `menus:` frontmatter only (missions-plan §5) —
    # `dream_missions` removed with the mission loader (card A)
  missions:                    # restrict-only overlay (missions-plan §6)
    # staleness:                # one block per mission id
    #   enabled: false          # disable is always honoured
    #   min_level: 3            # may only be raised above the file's value
    #   frequency: low          # may only move toward low (rarer)
    #   menus: [day]            # may only be narrowed, never widened

heartbeat:                      # in-process scheduler + per-tick ledger (§12, cards D+E)
  enabled: true                 # kill switch: false = the loop sleeps (hot, ≤60s)
  long_silence_factor: 3        # tick gap ≥ factor × frequency -> long_silence mood
                                # event (§7); 0 disables the feed
  # Per-tick NDJSON ledger, one line per tick (verdict/outcome/token_cost/…);
  # leaf under <log>, shared rotation engine keys below.
  log: heartbeat.log
  log_rotate_bytes: 1048576
  log_keep_generations: 5
  log_retention_days: 90
  log_compress: true
  log_compress_after: 1
  log_compress_level: 6
  log_rotate_by: size

idea:                          # idea missions (§17.10) — card 7a reads this
  enabled: true                # day draw + post-run dedupe/review/append gate
  bucket_file: Kael Ideas.md   # leaf under <vault>
  daily_weights: "25,55,20"    # day draw: index = ideas that day (0/1/2)
  category_weights: "1,1,1"    # improve-self, thought, business
  dedupe_threshold: 0.6        # keyword-Jaccard reject (0..1)
  review: true                 # JEV noul review before the write (fail-closed)
  review_threshold: 0.6
  express_min_gap_hours: 48    # min-gap:express candidacy gap
  log: idea.log                # under <log>, shared rotation keys (init-once)
  log_rotate_bytes: 1048576
  log_keep_generations: 5
  log_retention_days: 90
  log_compress: true
  log_compress_after: 1
  log_compress_level: 6
  log_rotate_by: size

mood:                          # feeling system (§15) — card 5 reads this
  dispatch_influence: true     # bounded + ledger-journaled; false = expression only
  decay_half_life: 6h

soul:                          # first-person identity + journal (soul-hook)
  enabled: true
  soul_file: Soul.md           # under <vault> (absolute paths honored)
  journal_file: Agent Journal.md
  inject: true                 # first-turn [soul] injection (identity + journal tail)
  inject_max_bytes: 4000       # shares the profile injection budget philosophy
  decide: true                 # idle JEV noul fold-down decision
  cooldown_turns: 3            # min top-level idle turns between soul fold-downs
  journal_tail_bytes: 6000     # recent journal bytes handed to the self-writer
  writer_agent: self-writer    # generation child (see .opencode/agents/self-writer.md)
  child_timeout_ms: 90000
  note_max_bytes: 6000         # Soul.md hard budget
  review: true                 # post-draft honesty/durability gate before write
  review_threshold: 0.6
  log: soul-hook.log           # under <log>
  log_rotate_bytes: 1048576
  log_keep_generations: 5
  log_retention_days: 90
  log_compress: true
  log_compress_after: 1
  log_compress_level: 6
  log_rotate_by: size

comms:                         # notification/approval channels (§7) — card 10 reads this
  default_channel: telegram    # telegram | email
  session_ttl: 24h             # lazy chat-session expiry (D15)
  telegram:
    enabled: false             # M5 not ported yet; card 10 turns this on
    bot_token_file: ""         # chmod-600 credential file; never inline the secret
    chat_id_file: ""
  email:
    enabled: false             # M5 not ported yet; card 10 turns this on
    account: your-account      # himalaya account name
    reply_window_hours: 48

dashboard:                     # local web UI (§9) — cards 8/11 read this
  bind_address: 127.0.0.1      # loopback only
  auth:
    mode: off                  # off | login | login+2fa (§10)
    require_tls: false

# EXAMPLE configuration — tracked safe-to-share template.
# Copy to `sysop-config.yaml` (firstboot.sh does this for you) and replace
# every `you@example.com` / `your-account` placeholder with your own values.
# The real sysop-config.yaml is gitignored: it holds your personal settings.
#
# Sysop agent settings — shared by all sub-agents and hooks.
# Readers: knowledge-hook / lib/autonomy.ts
# (knowledge: + paths:), audit-hook / lib/audit.ts (audit: + paths:),
# telegram-hook / lib/telegram.ts (telegram: +
# paths:), mail-hook / lib/mail.ts (mail: + paths:), profile-hook /
# lib/profile.ts (profile: + decisions: + paths:), jev-hook / lib/decisions.ts
# (decisions: + paths:), retrieval-hook / lib/retrieval.ts (retrieval: +
# decisions: + paths:), web-scan-hook / lib/browser.ts (browser: + paths:),
# idea-hook / lib/idea.ts (idea: + paths:),
# telemetry-hook / lib/telemetry.ts (telemetry: + paths:); web-scan-hook also
# reads telemetry: for its inner-fetch usage record,
# scoped-permissions.ts (paths:), vault-readonly-guard.ts + wikilink-guard.ts
# (vault: + paths:). Other sections are ignored by each reader.
#
# Every structured hook log is written through the shared engine
# (lib/logfile.ts + lib/logging.ts). Per-section `log_*` keys (bare `*` keys
# under `audit:`) configure one normalized shape:
#   rotate_bytes          size trigger (bytes); <= 0 disables
#   keep_generations      rotated generations kept (`log.1` .. `log.N`)
#   retention_days        delete rotated files older than this; <= 0 disables
#   compress              gzip rotated generations            [new]
#   compress_after        newest N rotated gens stay plain    [new]
#   compress_level        zlib level 1-9                      [new]
#   rotate_by             size | daily | weekly (UTC)         [new]

# Canonical path roots — the ONLY place the vault and sysop directory names
# live. Every section below stores a LEAF path relative to one of these roots
# (absolute or ~ paths are honored as overrides).
#
#   vault:    resolved against the repo root  (e.g. <repo>/Brain)
#   sysop:    resolved against the home dir   (~ expansion)
#   diagrams: resolved against the repo root  (diagram-developer write scope)
#   state:    resolved against the repo root  (project-local transient state:
#             the knowledge memory buffer + tag index; gitignored)
paths:
  vault: Brain
  sysop: ~/.opencode-sysop
  diagrams: diagrams
  state: .opencode/state

vault:
  # Agent-forbidden, user-write-only folders under <vault>. The agent may READ
  # them but must NEVER create/update/delete inside them — the user owns the
  # content and edits it in Obsidian. Enforced deterministically at the tool
  # boundary by vault-readonly-guard.ts (native edit/write/apply_patch + the
  # markdown-vault MCP vault tool), and honored by wikilink-guard.ts, whose
  # repair/idle sweeps skip these folders. Comma-separated, vault-relative.
  readonly: Journal

audit:
  enabled: true
  log: audit.log              # under <sysop> -> ~/.opencode-sysop/audit.log
  rotate_bytes: 10485760     # 10 MB — rotate when active log reaches this
  keep_generations: 5        # keep audit.log.1 .. audit.log.5 (shift-and-rename)
  retention_days: 90         # delete any rotated file older than this
  compress: true             # gzip rotated generations (bare keys, no log_ prefix)
  compress_after: 1          # keep audit.log.1 plain, gzip older
  compress_level: 6
  rotate_by: size            # size | daily | weekly

knowledge:
  enabled: true
  # Single project-local JSON Lines buffer of un-consumed conversation turns.
  # Owned by knowledge-hook (the only writer); rag-search reads it via the
  # temporal_search tool. `memory_file` / `tag_index_file` are LEAVES under
  # <state> -> .opencode/state/. See docs/temporal-memory-plan.md.
  memory_file: memory.json
  tag_index_file: tag-index.json
  min_ready_turns: 3         # start an ingestion cycle at this many unconsumed turns
  batch_turns: 8             # max turns handed to one ingestion cycle (N)
  max_turn_age: 86400000     # force-ingest turns older than this (ms); 0 disables
  drain_max_tokens: 150000   # aggregate token cap per cycle (chars/4)
  drain_cooldown_ms: 60000   # min gap between ingestion cycles
  # Conservative deterministic per-turn prefilter: only unambiguously trivial
  # turns (small, no code/command/config/URL/path, no question, both sides
  # filler) are auto-pruned without an LLM. Anything borderline ingests.
  skip_triage: true
  skip_triage_max_bytes: 800
  # Keyword-prefetched candidate notes handed to the ingestion child per cycle.
  prefetch_candidates: 3
  # Phase 3: capture-time JEV tagging (tag choice + salience score).
  tag_gate: true
  tag_candidates: 8
  # Per-cycle NDJSON ledger (tokens/cost/steps/outcome). `log` is a LEAF under
  # <sysop>. Written through the shared logging engine (see the header).
  log: knowledge-hook.log
  log_rotate_bytes: 1048576
  log_keep_generations: 5
  log_retention_days: 90
  log_compress: true
  log_compress_after: 1
  log_compress_level: 6
  log_rotate_by: size

telegram:
  # Deterministic outbound notifier (telegram-hook). Two jobs, both gated by
  # `enabled`: forward the final assistant reply of each top-level turn, and
  # raise an attention alert when the window blocks on a permission prompt
  # (sudo/file-write) or an agent question. Secrets live in the chmod-600
  # credential files below, never inline here. Read live on every event, so
  # flipping `enabled` needs no restart.
  enabled: true             # master on/off — set true to activate
  bot_token_file: ~/.config/update-reminder/telegram-token
  chat_id_file: ~/.config/update-reminder/telegram-chat-id
  agent: ""                  # reply-forward filter; "" = all agents, "plan" = plan-mode only
  parse_mode: Markdown       # Markdown | MarkdownV2 | HTML | "" (plain)
  max_chars: 4096            # Telegram per-message cap; longer replies are chunked
  header: true               # prepend "[agent] <timestamp>" to forwarded replies
  include_user: false        # prefix the triggering user message
  notify_permissions: true   # attention alerts on permission prompts (sudo/file-write)
  notify_questions: true     # attention alerts on agent questions

mail:
  # Mailbox access for the safe-mail sub-agent (mail-hook plugin -> himalaya).
  # The Gmail app password lives in the KDE keyring, NEVER here; himalaya reads
  # it via `secret-tool lookup` from ~/.config/himalaya/config.toml.
  enabled: true              # master on/off — false disables every mail_* tool
  account: your-account      # himalaya account name (see ~/.config/himalaya/config.toml)
  from: you@example.com  # sender identity; passed as --from (himalaya has no account email key)
  himalaya_bin: himalaya     # binary to invoke (argv only, never a shell)
  max_body_bytes: 262144     # 256 KiB cap on a single read body
  max_list: 25               # default envelopes per list/search
  injection_policy: block    # block = withhold high-severity bodies; flag = always return fenced
  autonomous_send: true      # safe-mail may send/reply without per-message confirmation
  new_recipient_warn: true   # flag sends to addresses the mailbox has never written to
  known_recipients: "you@example.com"  # seed allow-list (state file grows it)

decisions:
  # Typed-decision "System 1" provider (docs/jev-decision-provider-plan.md +
  # docs/openjev-opencode-provider-plan.md). The backend is
  # .opencode/scripts/openjevserver.py + decisions_bridge.py (a stateless
  # stdin/stdout subprocess). The TS side (lib/decisions.ts + jev-hook.ts /
  # knowledge-hook.ts) reads this block live.
  #
  #   `model` is an opencode spec `<provider>/<model>` — the provider id is the
  #   prefix before the first "/" — and its endpoint + API key are resolved from
  #   opencode's own models.json / auth.json, so no base_url/api_key_file is
  #   needed. Pick a model from `opencode models`.
  #
  #   mode: shadow — jev-hook.ts records non-gating model verdicts to the ledger.
  #   mode: gate   — knowledge-hook.ts lets the model skip (delete) confidently-
  #                  trivial sessions during drain triage; jev-hook keeps logging
  #                  verdicts to decisions.log (data), while the gate *action*
  #                  goes to knowledge-hook.log. Fail-open: only a confident
  #                  non-fallback "trivial" verdict skips; hard-keep reasons
  #                  (durable-signal/question/over-size) are never model-skippable
  #                  (plan §12 P5).
  enabled: true               # master on/off — gate skips only when true
  mode: gate                  # shadow | gate  (live gating — see header comment)
  provider: openjev           # openjev | rules
  model: deepseek/deepseek-chat   # opencode spec: <provider>/<model>
  # Advanced overrides (only needed for custom/local/SDK-only providers):
  # api_provider: ""          # provider id when `model` has no <provider>/ prefix
  # backend: llamacpp         # force the local llama.cpp backend
  # base_url: ""              # pin an endpoint (no /v1 suffix)
  # transport: chat           # chat | completion (llama.cpp only)
  # api_key_file: ""          # chmod-600 key file instead of opencode auth.json
  # auth_file: ""             # override path to opencode auth.json
  # models_file: ""           # override path to opencode models.json
  temperature_scaling: 1.00    # must stay 1.0 — hosted confidence is self-reported (uncalibrated)
  abstain_threshold: 0.45
  noul_threshold: 0.80         # gate skips only when model p(true) >= this
  timeout_ms: 30000            # per-call subprocess timeout
  n_probs: 20                  # candidate token depth (unused by the structured tier)
  fallback: rules
  # Hosted logprobs is degenerate at temperature 0, so the backend uses JSON-mode
  # self-reported confidence (UNcalibrated). Shadow ledger — one NDJSON line per
  # decision (plan §7). `ledger` is a LEAF under <sysop>. Written through the
  # shared logging engine (see the header).
  ledger: decisions.log
  log_rotate_bytes: 1048576
  log_keep_generations: 5
  log_retention_days: 90
  log_compress: true
  log_compress_after: 1
  log_compress_level: 6
  log_rotate_by: size

retrieval:
  # Per-turn "self-RAG" retrieval gate (retrieval-hook.ts). On EVERY user turn a
  # JEV `noul` decision asks whether the message is self-contained and needs no
  # vault search. Unlike the drain gate this one is FAIL-CLOSED: an error, a
  # timeout, or an abstain means NO retrieval (economy-first). The prose prior
  # (the assertion in prompts_file) is deliberately weighted toward "do not
  # retrieve" unless the message clearly refers to stored knowledge.
  #   gate: true  — a confident skip suppresses the Brain-First rag-search for
  #                 that turn and injects an authoritative [brain-first] block.
  #   gate: false — shadow mode: verdicts are logged, but every turn retrieves.
  # Explicit retrieval intent ("search my notes", "do you remember…") always wins
  # over the model when force_intent is true, protecting accuracy where it counts.
  enabled: true
  gate: true
  noul_threshold: 0.80         # skip only when model p("no retrieval needed") >= this
  timeout_ms: 30000            # per-turn decision subprocess timeout
  max_bytes: 4000              # only the head of the user message is judged
  force_intent: true           # deterministic explicit-intent override -> retrieve
  inject: true                 # push the [brain-first] directive into the system prompt
  prompts_file: .opencode/retrieval-prompts.json  # prose prior (assertion); ~/absolute honored
  # Per-turn NDJSON ledger. `log` is a LEAF under <sysop>; written through the
  # shared logging engine (see the header). One line per decision, with the
  # eventual gate action.
  log: retrieval.log
  log_rotate_bytes: 1048576
  log_keep_generations: 5
  log_retention_days: 90
  log_compress: true
  log_compress_after: 1
  log_compress_level: 6
  log_rotate_by: size

browser:
  # Deterministic web injection scan for webfetch/websearch (web-scan-hook).
  # Read once at plugin startup; changing values takes effect on restart.
  enabled: true              # master on/off — false disables the web scan
  injection_policy: flag     # flag = annotate+fence; block = additionally withhold instruction-family hits
  max_scan_bytes: 200000     # cap on bytes scanned per tool result (larger output is scanned only up to this head)
  # Full scan findings (family/severity/snippet) go here, not into the agent's
  # context. `scan_log` is a LEAF under <sysop>; written through the shared
  # logging engine (see the header).
  scan_log: web-scan.log
  log_rotate_bytes: 1048576  # 1 MB
  log_keep_generations: 5
  log_retention_days: 90
  log_compress: true
  log_compress_after: 1
  log_compress_level: 6
  log_rotate_by: size

profile:
  # Persona + user context as prompt-style instructions (profile-hook.ts). Two
  # jobs, both gated by `enabled`:
  #   1. inject — on the first turn of each top-level session, the two vault
  #      instruction notes are appended to the system prompt as directives
  #      (agent persona/behavior + user working context). Injected throughout
  #      the first turn, then cached/disabled until the session ends. Reads use
  #      <vault> + the leaf paths below.
  #   2. decide — at session.idle, a JEV `choice` decision (lib/decisions.ts ->
  #      openjevserver.py) asks whether the latest turn carries durable new info
  #      for either profile note. Only a confident, non-fallback verdict that
  #      names a note triggers an update; the update body is drafted by a
  #      short-lived `profile-writer` child (small model) and written directly
  #      by the plugin (atomic rename). Fail-open: a fallback/abstain never
  #      writes. Every write attempt also raises an in-app TUI toast (success
  #      or failure), gated by `notify`. `log` is a LEAF under <sysop>;
  #      rotation mirrors audit:.
  #
  #      Visibility: an NDJSON log, one line per event. Below-threshold turns
  #      log `profile-cooldown`; a pass that clears the gate emits one terminal
  #      `profile-pass` line whose `result` answers "did it update?" (updated /
  #      no-op / no-update / update-failed / prefilter-skip / no-transcript /
  #      decision-fallback / decision-abstain). Every event from one pass shares
  #      a `pass` id (p<N>), so a full pass can be grouped. Human view:
  #        jq -c 'select(.event=="profile-pass")' ~/.opencode-sysop/profile-hook.log
  #
  #      Reviewer: after the writer drafts a note, a second JEV `noul` gate
  #      (`review`) checks the additions are durable and globally applicable,
  #      rejecting session-specific or one-off task decisions before any write;
  #      a date-only draft is a `no-op`. Its assertion, plus the choice
  #      instructions/criteria, live in `prompts_file` (JSON) so update
  #      frequency + precision are tunable without touching the TypeScript.
  enabled: true
  notify: true                 # in-app TUI toast on profile update / failure
  agent_file: Agent.md       # under <vault> (absolute paths honored)
  user_file: User.md         # under <vault>
  inject: true                 # first-turn system-prompt injection
  inject_max_bytes: 4000       # per-note cap on injected content (frontmatter/Related already stripped)
  decide: true                 # idle JEV decision + conditional update
  cooldown_turns: 3            # min top-level idle turns between profile decisions
  decision_turns: 3            # last N session turns handed to the decision + writer
  decision_max_bytes: 24000    # cap on that transcript
  skip_triage: true            # skip the decision on trivial-chatter turns
  skip_triage_max_bytes: 800   # mirrors knowledge.skip_triage_max_bytes
  writer_agent: profile-writer # generation child (see .opencode/agents/profile-writer.md)
  writer_model: deepseek/deepseek-flash  # provider/model for the writer child
  child_timeout_ms: 90000      # max wait for the writer child to reply
  note_max_bytes: 6000        # writer hard budget; draft rejected above this (note is injected, must stay lean)
  prompts_file: .opencode/profile-prompts.json  # choice instructions/criteria + reviewer assertion (project-relative; ~ or absolute honored)
  review: true                 # post-draft durability/globalness gate before write
  review_threshold: 0.60       # noul pTrue needed to accept a drafted update
  log: profile-hook.log        # under <sysop>
  log_rotate_bytes: 1048576
  log_keep_generations: 5
  log_retention_days: 90
  log_compress: true
  log_compress_after: 1
  log_compress_level: 6
  log_rotate_by: size

idea:
  # Idea generation + expression (docs/idea-hook-plan.md). Two decoupled jobs:
  #
  #   Generation (idea-hook.ts + lib/idea.ts, in-process): a timer tick (plus a
  #   startup catch-up and a cheap due-check on session idle) draws 0-2 due times
  #   per day from `daily_weights`, builds a deterministic context (recent turns +
  #   bounded profile notes (agent_file/user_file) + a random vault note seed +
  #   existing idea titles),
  #   spawns a tool-free `idea-generator` child, then dedupes (keyword Jaccard)
  #   and reviews (JEV `noul` -> decisions:) before appending to the bucket note.
  #
  #   Expression (.opencode/scripts/idea-express.py, standalone systemd timer):
  #   reads the bucket and delivers one un-expressed idea over each enabled
  #   channel (Telegram + email), independent of opencode.
  enabled: true               # master on/off — set true to activate generation
  bucket_file: Ideas.md      # LEAF under <vault> (absolute paths honored)
  generator_agent: idea-generator  # generation child (see .opencode/agents/idea-generator.md)
  generator_model: deepseek/deepseek-flash  # provider/model for the child
  child_timeout_ms: 90000      # max wait for the generator child to reply
  interval_ms: 900000          # in-plugin tick (15 min)
  active_start_hour: 9         # generation + expression window (local time)
  active_end_hour: 23
  daily_weights: "25,55,20"    # P(0), P(1), P(2) ideas per day
  category_weights: "1,1,1"    # improve-self / thought / business
  seed_notes: 1                # vault notes sampled as context seed (0=off)
  context_turns: 4             # last N turns surfaced to the generator
  context_max_bytes: 12000     # cap on that transcript
  note_max_bytes: 8000         # per-idea body cap
  dedupe_threshold: 0.60       # keyword Jaccard reject
  review: true                 # post-draft JEV novelty/usefulness gate
  review_threshold: 0.60       # noul pTrue needed to accept an idea
  prompts_file: .opencode/idea-prompts.json  # generator instructions/criteria + reviewer assertion
  notify: true                 # in-app TUI toast on generate
  # expression (read by the standalone script)
  express_min_gap_hours: 48    # min gap between expressed ideas
  express_telegram: true       # deliver via Telegram
  express_email: true          # deliver via email
  express_token_file: ~/.config/update-reminder/telegram-token
  express_chat_id_file: ~/.config/update-reminder/telegram-chat-id
  express_parse_mode: Markdown
  express_email_to: you@example.com  # recipient of expressed ideas (sent via your default msmtp account)
  express_email_bin: msmtp
  # logs
  log: idea-hook.log           # under <sysop>
  log_rotate_bytes: 1048576
  log_keep_generations: 5
  log_retention_days: 90
  log_compress: true
  log_compress_after: 1
  log_compress_level: 6
  log_rotate_by: size

telemetry:
  # Phase 0 retrieval telemetry (telemetry-hook.ts + lib/telemetry.ts; also read
  # by web-scan-hook.ts). Deterministic NDJSON usage records for the expensive
  # retrieval paths, so Phases 1-4 are falsifiable. Contract: logging only, zero
  # behavior change, no LLM, no prompt text or full URLs in the ledger.
  #   0a rag-search delegations -> brain_log  (one line per Brain-First turn)
  #   0b browser delegations    -> web_log    (`web-task`)
  #      inner webfetch/websearch-> web_log    (`web-fetch`)
  # Both channels share one rotation policy via the BARE keys below (the audit:
  # pattern). Leaves are relative to <sysop>; absolute or ~ paths are honored.
  enabled: true                # master on/off — false disables both ledgers
  watch_agents: rag-search,safe-browser,deep-browser  # measured `task` delegates
  brain_log: rag-search.log
  web_log: web-usage.log
  rotate_bytes: 1048576
  keep_generations: 5
  retention_days: 90
  compress: true
  compress_after: 1
  compress_level: 6
  rotate_by: size

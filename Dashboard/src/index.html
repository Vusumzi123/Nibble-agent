<!doctype html>
<html lang="en" data-theme="nibble" data-accent="lime" data-density="compact">
  <head>
    <meta charset="utf-8" />
    <title>Nibble · operator console</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0b0d'/%3E%3Cpath d='M6 6h9v9H6zM17 17h9v9h-9z' fill='%23c6f36b'/%3E%3C/svg%3E" />
    <script>
      try {
        var raw = localStorage.getItem('nibble.dashboard.v2');
        if (raw) {
          var saved = JSON.parse(raw);
          var root = document.documentElement;
          if (saved.theme) root.dataset.theme = saved.theme;
          if (saved.accent) root.dataset.accent = saved.accent;
          if (saved.density) root.dataset.density = saved.density;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <db-root></db-root>
  </body>
</html>
